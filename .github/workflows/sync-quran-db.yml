name: sync-quran-db

on:
  push:
    paths:
      - corpus_sources/riwayat/hafs/quran.json
      - quranic_phonemizer/data/riwayat/hafs/corpus/surah_info.json
      - quranic_phonemizer/data/riwayat/hafs/corpus/quran_db.bin
      - tools/build_hafs_corpus.py
  pull_request:
    paths:
      - corpus_sources/riwayat/hafs/quran.json
      - quranic_phonemizer/data/riwayat/hafs/corpus/surah_info.json
      - quranic_phonemizer/data/riwayat/hafs/corpus/quran_db.bin
      - tools/build_hafs_corpus.py

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate Hafs corpus
        run: python tools/build_hafs_corpus.py
      - name: Confirm packed corpus is current
        run: |
          corpus=quranic_phonemizer/data/riwayat/hafs/corpus/quran_db.bin
          if ! git diff --quiet "$corpus"; then
            echo "::error::quran_db.bin is out of sync with the Hafs source or address data."
            echo "Run 'python tools/build_hafs_corpus.py' locally and commit the result."
            git diff --stat "$corpus"
            exit 1
          fi
