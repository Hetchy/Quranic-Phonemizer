# Thresholds are floors that may only rise. The residues are real and named in
# docs/, so requiring zero would mean a red build with nothing to do about it,
# and requiring nothing would let a regression land silently.
name: gates

on:
  push:
    branches: [main, "riwayah/**"]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q

  comments:
    # The comment rules in CLAUDE.md, checked rather than remembered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/comment_lint.py

  cross-script:
    # The claim the design is named for: two scripts, same phonemes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: cross-script parity, both modes
        run: |
          python tools/floor.py cross word 99.911
          python tools/floor.py cross verse 99.889

  regression:
    # Not a target. The oracle is the previous implementation with its defects
    # frozen in, so this is a change detector.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: regression oracle, both modes
        run: |
          python tools/floor.py regression word 99.800
          python tools/floor.py regression verse 97.553

  roundtrip:
    # Every Score can be spelled and spells back to itself. The floor is the
    # digest round-trip; the gate proper is `unspellable`, which is zero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python tools/floor.py roundtrip uthmani 98.813

  attestation:
    # A shadda a script writes must be produced by some occurrence. One
    # directional: an occurrence with no attestation behind it is not an error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: unmet attestations, both scripts
        run: |
          python tools/floor.py attest uthmani 190
          python tools/floor.py attest indopak 259

  l1:
    # Score-level script equality. The ceiling stops the residue growing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python tools/floor.py l1 - 105
