# Pull requests run behavioral tests, architectural boundaries, and exact
# Arabic source-context validation as separate jobs.
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [suite, lint, structure, test-style]
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python tools/gates.py ${{ matrix.name }}
