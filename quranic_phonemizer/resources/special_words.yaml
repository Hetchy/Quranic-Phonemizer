# Special words in the Quran that require custom phoneme mappings
# These include huroof muqatta'at (opening letters) and unique words
#
# Format:
# - text: The Arabic text of the word (with all diacritics/symbols)
#   locations: List of surah:verse:word locations
#   letter_mappings: List of letter-level mappings with:
#     - char: The Arabic letter (with any attached madd/diacritics)
#     - phonemes: List of phonemes for this letter
#   display_text: (muqattaat only) Spelled-out phonetic text form
#   tajweed_mapping: Tajweed rule annotations.
#     Muqattaat: each item is one word in the spelled-out form with entries per grapheme.
#     Non-muqattaat: single item with entries per letter.
#     source_rules/target_rules use TajweedRule enum string values.

special_words:
  # ── Huroof muqattaat ──────────────────────────────────────────────

  - text: "حمٓ"
    display_text: "حَا مِيٓمْ"
    locations:
      - "40:1:1"  # Surah Ghafir
      - "41:1:1"  # Surah Fussilat
      - "42:1:1"  # Surah Ash-Shura
      - "43:1:1"  # Surah Az-Zukhruf
      - "44:1:1"  # Surah Ad-Dukhan
      - "45:1:1"  # Surah Al-Jathiyah
      - "46:1:1"  # Surah Al-Ahqaf
    letter_mappings:
      - char: "ح"
        phonemes: ["ħ", "a:"]
      - char: "مٓ"
        phonemes: ["m", "i:", "m"]
    tajweed_mapping:
      - text: "حَا"
        entries:
          - char: "ح"
          - char: "ا"
            source_rules: ["madd_tabii"]
      - text: "مِيٓمْ"
        entries:
          - char: "م"
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "م"

  - text: "الٓمٓ"
    display_text: "أَلِفْ لَآم مِّيٓمْ"
    locations:
      - "2:1:1"   # Surah Al-Baqarah
      - "3:1:1"   # Surah Āl-Imran
      - "29:1:1"  # Surah Al-Ankabut
      - "30:1:1"  # Surah Al-Rum
      - "31:1:1"  # Surah Luqman
      - "32:1:1"  # Surah As-Sajdah
    letter_mappings:
      - char: "ا"
        phonemes: ["ʔ", "a", "l", "i", "f"]
      - char: "لٓ"
        phonemes: ["l", "a:"]
      - char: "مٓ"
        phonemes: ["m̃", "i:", "m"]
    tajweed_mapping:
      - text: "أَلِفْ"
        entries:
          - char: "أ"
          - char: "ل"
          - char: "ف"
      - text: "لَآم"
        entries:
          - char: "ل"
          - char: "ا"
            source_rules: ["madd_lazim"]
          - char: "م"
            source_rules: ["idgham_shafawi"]
      - text: "مِّيٓمْ"
        entries:
          - char: "م"
            target_rules: ["idgham_shafawi"]
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "م"

  - text: "الٓر ۚ"
    display_text: "أَلِفْ لَآمْ رَا"
    locations:
      - "10:1:1"  # Surah Yunus
      - "11:1:1"  # Surah Hud
      - "12:1:1"  # Surah Yusuf
      - "14:1:1"  # Surah Ibrahim
      - "15:1:1"  # Surah Al-Hijr
    letter_mappings:
      - char: "ا"
        phonemes: ["ʔ", "a", "l", "i", "f"]
      - char: "لٓ"
        phonemes: ["l", "a:"]
      - char: "ر"
        phonemes: ["m", "rˤ", "aˤ:"]
      - char: " ۚ"
        phonemes: []
    tajweed_mapping:
      - text: "أَلِفْ"
        entries:
          - char: "أ"
          - char: "ل"
          - char: "ف"
      - text: "لَآمْ"
        entries:
          - char: "ل"
          - char: "ا"
            source_rules: ["madd_lazim"]
          - char: "م"
      - text: "رَا"
        entries:
          - char: "ر"
            source_rules: ["tafkheem"]
          - char: "ا"
            source_rules: ["madd_tabii", "tafkheem"]

  - text: "الٓمٓصٓ"
    display_text: "أَلِفْ لَآم مِّيٓمْ صَآدْ"
    locations:
      - "7:1:1"   # Surah Al-A'raf
    letter_mappings:
      - char: "ا"
        phonemes: ["ʔ", "a", "l", "i", "f"]
      - char: "لٓ"
        phonemes: ["l", "a:"]
      - char: "مٓ"
        phonemes: ["m̃", "i:", "m"]
      - char: "صٓ"
        phonemes: ["sˤ", "aˤ:", "d", "Q"]
    tajweed_mapping:
      - text: "أَلِفْ"
        entries:
          - char: "أ"
          - char: "ل"
          - char: "ف"
      - text: "لَآم"
        entries:
          - char: "ل"
          - char: "ا"
            source_rules: ["madd_lazim"]
          - char: "م"
            source_rules: ["idgham_shafawi"]
      - text: "مِّيٓمْ"
        entries:
          - char: "م"
            target_rules: ["idgham_shafawi"]
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "م"
      - text: "صَآدْ"
        entries:
          - char: "ص"
            source_rules: ["tafkheem"]
          - char: "ا"
            source_rules: ["madd_lazim", "tafkheem"]
          - char: "د"
            source_rules: ["qalqala_kubra"]

  - text: "الٓمٓر ۚ"
    display_text: "أَلِفْ لَآم مِّيٓمْ رَا"
    locations:
      - "13:1:1"  # Surah Ar-Ra'd
    letter_mappings:
      - char: "ا"
        phonemes: ["ʔ", "a", "l", "i", "f"]
      - char: "لٓ"
        phonemes: ["l", "a:"]
      - char: "مٓ"
        phonemes: ["m̃", "i:", "m"]
      - char: "ر"
        phonemes: ["rˤ", "aˤ:"]
      - char: " ۚ"
        phonemes: []
    tajweed_mapping:
      - text: "أَلِفْ"
        entries:
          - char: "أ"
          - char: "ل"
          - char: "ف"
      - text: "لَآم"
        entries:
          - char: "ل"
          - char: "ا"
            source_rules: ["madd_lazim"]
          - char: "م"
            source_rules: ["idgham_shafawi"]
      - text: "مِّيٓمْ"
        entries:
          - char: "م"
            target_rules: ["idgham_shafawi"]
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "م"
      - text: "رَا"
        entries:
          - char: "ر"
            source_rules: ["tafkheem"]
          - char: "ا"
            source_rules: ["madd_tabii", "tafkheem"]

  - text: "كٓهيعٓصٓ"
    display_text: "كآفْ هَا يَا عَيْن صَآدْ"
    locations:
      - "19:1:1"  # Surah Maryam
    letter_mappings:
      - char: "كٓ"
        phonemes: ["k", "a:", "f"]
      - char: "ه"
        phonemes: ["h", "a:"]
      - char: "ي"
        phonemes: ["j", "a:"]
      - char: "عٓ"
        phonemes: ["ʕ", "a", "j", "ŋ"]
      - char: "صٓ"
        phonemes: ["sˤ", "aˤ:", "d", "Q"]
    tajweed_mapping:
      - text: "كآفْ"
        entries:
          - char: "ك"
          - char: "ا"
            source_rules: ["madd_lazim"]
          - char: "ف"
      - text: "هَا"
        entries:
          - char: "ه"
          - char: "ا"
            source_rules: ["madd_tabii"]
      - text: "يَا"
        entries:
          - char: "ي"
          - char: "ا"
            source_rules: ["madd_tabii"]
      - text: "عَيْن"
        entries:
          - char: "ع"
          - char: "ي"
          - char: "ن"
            source_rules: ["ikhfaa_noon"]
      - text: "صَآدْ"
        entries:
          - char: "ص"
            source_rules: ["tafkheem"]
            target_rules: ["ikhfaa_noon"]
          - char: "ا"
            source_rules: ["madd_lazim", "tafkheem"]
          - char: "د"
            source_rules: ["qalqala_kubra"]

  - text: "طسٓمٓ"
    display_text: "طَا سِيٓن مِّيٓمْ"
    locations:
      - "26:1:1"  # Surah Ash-Shu'ara
      - "28:1:1"  # Surah Al-Qasas
    letter_mappings:
      - char: "ط"
        phonemes: ["tˤ", "aˤ:"]
      - char: "سٓ"
        phonemes: ["s", "i:"]
      - char: "مٓ"
        phonemes: ["m̃", "i:", "m"]
    tajweed_mapping:
      - text: "طَا"
        entries:
          - char: "ط"
            source_rules: ["tafkheem"]
          - char: "ا"
            source_rules: ["madd_tabii", "tafkheem"]
      - text: "سِيٓن"
        entries:
          - char: "س"
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "ن"
            source_rules: ["idgham_ghunnah_noon"]
      - text: "مِّيٓمْ"
        entries:
          - char: "م"
            target_rules: ["idgham_ghunnah_noon"]
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "م"

  - text: "طسٓ ۚ"
    display_text: "طَا سِيٓنْ"
    locations:
      - "27:1:1"  # Surah An-Naml
    letter_mappings:
      - char: "ط"
        phonemes: ["tˤ", "aˤ:"]
      - char: "سٓ"
        phonemes: ["s", "i:", "n"]
      - char: " ۚ"
        phonemes: []
    tajweed_mapping:
      - text: "طَا"
        entries:
          - char: "ط"
            source_rules: ["tafkheem"]
          - char: "ا"
            source_rules: ["madd_tabii", "tafkheem"]
      - text: "سِيٓنْ"
        entries:
          - char: "س"
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "ن"

  - text: "طه"
    display_text: "طَا هَا"
    locations:
      - "20:1:1"  # Surah Ta-Ha
    letter_mappings:
      - char: "ط"
        phonemes: ["tˤ", "aˤ:"]
      - char: "ه"
        phonemes: ["h", "a:"]
    tajweed_mapping:
      - text: "طَا"
        entries:
          - char: "ط"
            source_rules: ["tafkheem"]
          - char: "ا"
            source_rules: ["madd_tabii", "tafkheem"]
      - text: "هَا"
        entries:
          - char: "ه"
          - char: "ا"
            source_rules: ["madd_tabii"]

  - text: "يسٓ"
    display_text: "يَا سِيٓنْ"
    locations:
      - "36:1:1"  # Surah Ya-Sin
    letter_mappings:
      - char: "ي"
        phonemes: ["j", "a:"]
      - char: "سٓ"
        phonemes: ["s", "i:", "n"]
    tajweed_mapping:
      - text: "يَا"
        entries:
          - char: "ي"
          - char: "ا"
            source_rules: ["madd_tabii"]
      - text: "سِيٓنْ"
        entries:
          - char: "س"
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "ن"

  - text: "عٓسٓقٓ"
    display_text: "عَيْن سِيٓن قَآفْ"
    locations:
      - "42:2:1"  # Surah Ash-Shura
    letter_mappings:
      - char: "عٓ"
        phonemes: ["ʕ", "a", "j", "ŋ"]
      - char: "سٓ"
        phonemes: ["s", "i:", "ŋ"]
      - char: "قٓ"
        phonemes: ["q", "aˤ:", "f"]
    tajweed_mapping:
      - text: "عَيْن"
        entries:
          - char: "ع"
          - char: "ي"
          - char: "ن"
            source_rules: ["ikhfaa_noon"]
      - text: "سِيٓن"
        entries:
          - char: "س"
            target_rules: ["ikhfaa_noon"]
          - char: "ي"
            source_rules: ["madd_lazim"]
          - char: "ن"
            source_rules: ["ikhfaa_noon"]
      - text: "قَآفْ"
        entries:
          - char: "ق"
            source_rules: ["tafkheem"]
            target_rules: ["ikhfaa_noon"]
          - char: "ا"
            source_rules: ["madd_lazim", "tafkheem"]
          - char: "ف"

  - text: "صٓ ۚ"
    display_text: "صَآدْ"
    locations:
      - "38:1:1"  # Surah Sad
    letter_mappings:
      - char: "صٓ"
        phonemes: ["sˤ", "aˤ:", "d", "Q"]
      - char: " ۚ"
        phonemes: []
    tajweed_mapping:
      - text: "صَآدْ"
        entries:
          - char: "ص"
            source_rules: ["tafkheem"]
          - char: "ا"
            source_rules: ["madd_lazim", "tafkheem"]
          - char: "د"
            source_rules: ["qalqala_kubra"]

  - text: "قٓ ۚ"
    display_text: "قَآفْ"
    locations:
      - "50:1:1"  # Surah Qaf
    letter_mappings:
      - char: "قٓ"
        phonemes: ["q", "aˤ:", "f"]
      - char: " ۚ"
        phonemes: []
    tajweed_mapping:
      - text: "قَآفْ"
        entries:
          - char: "ق"
            source_rules: ["tafkheem"]
          - char: "ا"
            source_rules: ["madd_lazim", "tafkheem"]
          - char: "ف"

  - text: "نٓ ۚ"
    display_text: "نُوٓنْ"
    locations:
      - "68:1:1"  # Surah Al-Qalam
    letter_mappings:
      - char: "نٓ"
        phonemes: ["n", "u:", "n"]
      - char: " ۚ"
        phonemes: []
    tajweed_mapping:
      - text: "نُوٓنْ"
        entries:
          - char: "ن"
          - char: "و"
            source_rules: ["madd_lazim"]
          - char: "ن"

  # ── Non-muqattaat special words ───────────────────────────────────

  - text: "مَجْرٜىٰهَا"
    locations:
      - "11:41:6"  # Surah Hud
    letter_mappings:
      - char: "مَ"
        phonemes: ["m", "a"]
      - char: "جْ"
        phonemes: ["ʒ", "Q"]
      - char: "ر۪"
        phonemes: ["r"]
      - char: "ىٰ"
        phonemes: ["i:"]
      - char: "هَ"
        phonemes: ["h", "a:"]
      - char: "ا"
        phonemes: []
    tajweed_mapping:
      - entries:
          - char: "م"
          - char: "ج"
            source_rules: ["qalqala_sughra"]
          - char: "ر"
          - char: "ى"
          - char: "ه"
            source_rules: ["madd_tabii"]
          - char: "ا"

  - text: "نُـۨجِي"
    locations:
      - "21:88:7"  # Surah Al-Anbiya
    letter_mappings:
      - char: "نُ"
        phonemes: ["n", "u"]
      - char: "ـۨ"
        phonemes: ["ŋ"]
      - char: "جِ"
        phonemes: ["ʒ", "i"]
      - char: "ى"
        phonemes: []
    tajweed_mapping:
      - entries:
          - char: "ن"
          - char: "ـ"
            source_rules: ["ikhfaa_noon"]
          - char: "ج"
          - char: "ى"
            source_rules: ["silent_iltiqaa_sakinayn"]

  - text: "فَٱدَّٰرَٰ͏ْٔتُمْ"
    locations:
      - "2:72:4"  # Surah Al-Baqarah
    letter_mappings:
      - char: "فَ"
        phonemes: ["f", "a"]
      - char: "ٱ"
        phonemes: []
      - char: "دَّٰ"
        phonemes: ["dd", "a:"]
      - char: "رَٰ͏"
        phonemes: ["rˤ", "aˤ"]
      - char: "ْٔ"
        phonemes: ["ʔ"]
      - char: "تُ"
        phonemes: ["t", "u"]
      - char: "مْ"
        phonemes: ["m"]
    tajweed_mapping:
      - entries:
          - char: "ف"
          - char: "ٱ"
            source_rules: ["hamza_wasl_silent"]
          - char: "د"
            source_rules: ["madd_tabii"]
          - char: "ر"
          - char: "ء"
          - char: "ت"
          - char: "م"

  - text: "ءَا۬عْجَمِىٌّ"
    locations:
      - "41:44:9"  # Surah Fussilat
    letter_mappings:
      - char: "ءَ"
        phonemes: ["ʔ", "a"]
      - char: "ا۬"
        phonemes: ["ʔ", "a"]
      - char: "عْ"
        phonemes: ["ʕ"]
      - char: "جَ"
        phonemes: ["ʒ", "a"]
      - char: "مِ"
        phonemes: ["m", "i"]
      - char: "ىٌّ"
        phonemes: ["jj", "u"]
    tajweed_mapping:
      - entries:
          - char: "ء"
          - char: "ا"
          - char: "ع"
          - char: "ج"
          - char: "م"
          - char: "ى"
