# Closed classes of Arabic, not of this corpus. Every key is canonical
# letters, so one entry serves every script of the riwayah.
#
# These replace a 575-skeleton table learned from Uthmani's own U+0671
# positions. The three morphological rules in canon/derive/wasl.py do the
# work; what remains is a handful of lexemes a grammarian names without
# seeing this corpus. Entries are stems: the loader also matches a stem plus
# any clitic pronoun, so `إيمان` covers `إيمانكم` and `إيمانهم` too.
#
# ADR-008 §4.2 budgets these. A rise past the ceiling means a rule is
# missing, not that the corpus is irregular.
schema_version: 1

# Hamza-initial particles that look prosthetic and are not.
wasl_particles: ["ءن", "ءذ", "ءذن"]

# Proper nouns, form-IV verbal nouns, and the ʾū- lexemes.
wasl_exempt:
  - "ءسرءل"      # إسرائيل
  - "ءسمعل"      # إسماعيل
  - "ءبرهم"      # إبراهيم
  - "ءبلس"       # إبليس
  - "ءسحق"       # إسحاق
  - "ءمن"        # إيمان
  - "ءحسن"       # إحسان
  - "ءخون"       # إخوان
  - "ءلون"       # ألوان
  - "ءلسنت"      # ألسنة
  - "ءلق"        # ألقى
  - "ءلف"        # ألف
  - "ءحد"        # إحدى
  - "ءخرج"       # إخراج
  - "ءلت"        # سألت
  - "ءت"         # أوتوا
  - "ءل"         # أولو
  - "ءثم"        # إثم
  - "ءلحق"      # ألحق
  - "ءتء"       # إيتاء
  - "ءطعم"      # إطعام
  - "ءليس"      # إلياس
  # hamza + lām roots. These collide with the article and only a dictionary
  # separates them, so they are listed. `is_wasl` consults the article first,
  # which is what keeps a three-letter entry from swallowing the definite
  # class — see the ordering note there.
  - "ءلف"       # ألّف، ألف، ألفينا
  - "ءلن"       # ألّا، ألّن
  - "ءلزم"      # ألزم
  - "ءله"       # ألهم، ألهاكم
  - "ءلوح"      # ألواح
  - "ءلسن"      # ألسنة
  - "ءلحف"      # إلحاف
  - "ءلحد"      # إلحاد
  - "ءلد"       # ألدّ
  # nouns and form-IV verbs
  - "ءخو"       # إخوة
  - "ءخت"       # أخت
  - "ءدرس"      # إدريس
  - "ءفك"       # إفك
  - "ءصر"       # إصر
  - "ءعط"       # أعطى
  - "ءد"        # إدّ
  - "ءنتم"      # أنتم
  # muqattaʿat forms, until canon/spell.py expands them in phase 4
  - "ءلم"
  - "ءلر"
  - "ءلمص"
  - "ءلمر"

# The ten nouns: kasra regardless of the third letter. `اسم` would otherwise
# derive damma from the mīm.
wasl_nouns: ["ءسم", "ءبن", "ءبنة", "ءمرء", "ءمرءة", "ءثنن", "ءثنتن", "ءست"]

# The seven alifs (ADR-003 §6.2): short in wasl, long at pause.
# `لَٰكِنَّ` and `لَّـٰكِنَّا۠` share a key even with the vowels and the
# gemination spelled, so the second is a Ledger entry rather than a
# lexeme: one site, and no rule can reach it.
pausal_lexemes: ["ءaنa",                  "ءaلظuنuنa",
                 "ءaلرaسuلa",
                 "ءaلسaبiلa",
                 "قaوaرiرa",
                 "سaلسaبiلa"]
