# The uthmani scalar inventory. Total over the script's scalars: an
# unlisted scalar is a parse error, never a silent skip (L3).
schema_version: 1
script: uthmani
riwayah: hafs

letters:
  "ب": BA
  "ت": TA
  "ث": THA
  "ج": JEEM
  "ح": HA
  "خ": KHA
  "د": DAL
  "ذ": THAL
  "ر": RA
  "ز": ZAY
  "س": SEEN
  "ش": SHEEN
  "ص": SAD
  "ض": DAD
  "ط": TAH
  "ظ": ZAH
  "ع": AIN
  "غ": GHAIN
  "ف": FA
  "ق": QAF
  "ك": KAF
  "ل": LAM
  "م": MEEM
  "ن": NOON
  "ه": HEH
  "ة": TAA_MARBUTA
  "ا": {letter: ALIF, seat: true}
  "و": {letter: WAW, dagger_host: true, seat: true}
  "ي": {letter: YA, seat: true}
  "ى": {letter: YA, dagger_host: true, bare_rasm: true, seat: true}   # alif maqsura
  "ء": HAMZA
  "أ": HAMZA
  "إ": HAMZA
  "ؤ": HAMZA
  "ئ": HAMZA
  "ٱ": {letter: HAMZA, onset: WASL}   # the wasl hamza, written out

seats: ["ـ"]
combining_hamza: ["ٔ", "ٕ"]

evidences:
  "َ": {fact: VOWEL_QUALITY, cls: haraka, role: fatha,
       value: {kind: Short, quality: A}}
  "ُ": {fact: VOWEL_QUALITY, cls: haraka, role: damma,
       value: {kind: Short, quality: U}}
  "ِ": {fact: VOWEL_QUALITY, cls: haraka, role: kasra,
       value: {kind: Short, quality: I}}
  "ً": {fact: VOWEL_QUALITY, cls: tanween, role: fathatan,
       derivation: tanween}
  "ٌ": {fact: VOWEL_QUALITY, cls: tanween, role: dammatan,
       derivation: tanween}
  "ٍ": {fact: VOWEL_QUALITY, cls: tanween, role: kasratan,
       derivation: tanween}
  "ْ": {fact: VOWEL_ABSENCE, cls: haraka, role: sukun,
       value: {kind: Silent}}
  "ّ": {fact: ONSET, cls: shadda, role: shadda,
       derivation: gemination}
  "ٰ": {fact: VOWEL_LENGTH, cls: small_vowel, role: dagger,
       derivation: length_a}
  "ٔ": {fact: LETTER, cls: base, role: combining_hamza, value: HAMZA}
  "ٕ": {fact: LETTER, cls: base, role: combining_hamza, value: HAMZA}
  # Letters the rasm leaves out, written small. Each takes a position of its
  # own, and `carrier` decides whether it lengthens the vowel before it or
  # stands as a consonant of its own.
  "ۥ": {fact: LETTER, cls: base, role: small_waw, value: WAW, omitted: true}
  "ۦ": {fact: LETTER, cls: base, role: small_ya, value: YA, omitted: true}
  "ۧ": {fact: LETTER, cls: base, role: small_ya, value: YA, omitted: true}
  # A zero, not a vowel: the alif it sits on is silent when joined to and
  # said at a pause. `silence_sign` is what it is; the length it evidences
  # is what it does.
  "۠": {fact: VOWEL_LENGTH, cls: silence_sign, role: pausal,
       derivation: pausal_length}
  "۪": {fact: VOWEL_QUALITY, cls: annotation, role: imala,
       value: {kind: Long, quality: e}}
  "۫": {fact: TAJWEED_MARK, cls: annotation, role: ishmam, value: ISHMAM}
  "۬": {fact: ONSET, cls: annotation, role: tashil, value: TASHIL}
  "ۨ": {fact: LETTER, cls: base, role: mini_noon, value: NOON, omitted: true}
  "ۜ": {fact: LETTER, cls: annotation, role: seen_over, value: SEEN}
  "ۣ": {fact: LETTER, cls: annotation, role: seen_over, value: SEEN}

decorates:
  "ٓ": {slot: long_nucleus, cls: madd_sign, role: madd}
  "۟": {slot: host, cls: silence_sign, silences: true}

advice:
  "ۖ": PREFERRED_CONTINUE
  "ۗ": PREFERRED_STOP
  "ۚ": OPTIONAL_STOP
  "ۘ": COMPULSORY_STOP
  "ۙ": PROHIBITED_STOP
  "ۛ": EITHER_STOP

structural: [" ", "۞", "۩", "‏"]
