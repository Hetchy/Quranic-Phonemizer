# The uthmani scalar inventory. Total over the script's scalars: an
# unlisted scalar is a parse error, never a silent skip (L3).
schema_version: 1
script: uthmani
riwayah: hafs

letters:
  "ب": BA
  "ت": TA
  "ث": THA
  "ج": JEEM
  "ح": HA
  "خ": KHA
  "د": DAL
  "ذ": THAL
  "ر": RA
  "ز": ZAY
  "س": SEEN
  "ش": SHEEN
  "ص": SAD
  "ض": DAD
  "ط": TAH
  "ظ": ZAH
  "ع": AIN
  "غ": GHAIN
  "ف": FA
  "ق": QAF
  "ك": KAF
  "ل": LAM
  "م": MEEM
  "ن": NOON
  "ه": HEH
  "ة": TAA_MARBUTA
  "ا": ALIF
  "و": {letter: WAW, dagger_host: true}
  "ي": YA
  "ى": {letter: YA, dagger_host: true, bare_rasm: true}   # alif maqsura
  "ء": HAMZA
  "أ": HAMZA
  "إ": HAMZA
  "ؤ": HAMZA
  "ئ": HAMZA
  "ٱ": {letter: HAMZA, onset: WASL}   # the wasl hamza, written out

seats: ["ـ"]
combining_hamza: ["ٔ", "ٕ"]

evidences:
  "َ": {fact: NUCLEUS, cls: haraka, role: fatha,
       value: {kind: Short, quality: A}}
  "ُ": {fact: NUCLEUS, cls: haraka, role: damma,
       value: {kind: Short, quality: U}}
  "ِ": {fact: NUCLEUS, cls: haraka, role: kasra,
       value: {kind: Short, quality: I}}
  "ً": {fact: NUCLEUS, cls: tanween, role: fathatan,
       derivation: tanween}
  "ٌ": {fact: NUCLEUS, cls: tanween, role: dammatan,
       derivation: tanween}
  "ٍ": {fact: NUCLEUS, cls: tanween, role: kasratan,
       derivation: tanween}
  "ْ": {fact: NUCLEUS, cls: haraka, role: sukun,
       value: {kind: Silent}}
  "ّ": {fact: ONSET, cls: shadda, role: shadda,
       derivation: gemination}
  "ٰ": {fact: NUCLEUS, cls: small_vowel, role: dagger,
       derivation: length_a}
  "ٔ": {fact: LETTER, cls: base, role: combining_hamza, value: HAMZA}
  "ٕ": {fact: LETTER, cls: base, role: combining_hamza, value: HAMZA}
  "ۥ": {fact: NUCLEUS, cls: small_vowel, role: silah_waw,
       derivation: silah_waw}
  "ۦ": {fact: NUCLEUS, cls: small_vowel, role: silah_ya,
       derivation: silah_ya}
  "ۧ": {fact: NUCLEUS, cls: small_vowel, role: silah_ya,
       derivation: silah_ya}
  "۠": {fact: NUCLEUS, cls: small_vowel, role: pausal,
       value: {kind: PausalLong, quality: A}}   # the seven alifs
  "۪": {fact: NUCLEUS, cls: annotation, role: imala,
       value: {kind: Long, quality: IMALA}}
  "۫": {fact: NUCLEUS, cls: annotation, role: ishmam,
       value: {kind: Short, quality: ISHMAM}}
  "۬": {fact: ONSET, cls: annotation, role: tashil, value: TASHIL}
  "ۨ": {fact: LETTER, cls: base, role: mini_noon, value: NOON}
  "ۜ": {fact: LETTER, cls: annotation, role: seen_over, value: SEEN}
  "ۣ": {fact: LETTER, cls: annotation, role: seen_over, value: SEEN}

decorates:
  "ٓ": {slot: long_nucleus, cls: madd_sign}   # the maddah: it shows a
                                                   # madd and supplies nothing
  "۟": {slot: host, cls: silence_sign}        # the rounded zero

advice:
  "ۖ": PREFERRED_CONTINUE
  "ۗ": PREFERRED_STOP
  "ۚ": OPTIONAL_STOP
  "ۘ": COMPULSORY_STOP
  "ۙ": PROHIBITED_STOP
  "ۛ": EITHER_STOP

structural: [" ", "۞", "۩", "‏"]

polysemous:
  "ۜ": [SAKT, KHILAF_SITE]
  "ۧ": [SILAH, LONG_VOWEL]
  "ۦ": [SILAH, LONG_VOWEL]
