# Scalar Warsh choices. Selector families land per owner-family PR; an ID
# is published here only once its rules bind, so the catalogue never carries
# a silent no-op selector. Runtime raa site keys live in the authored
# registers of riwayat/warsh/raa.py; this file owns options, defaults, and
# the public catalogue.
schema_version: 3
group_order:
  [word_readings, joined_readings, stopping_starting, inclination,
   hamza_readings, lam_pronunciation, raa_pronunciation, nasal_variants]

