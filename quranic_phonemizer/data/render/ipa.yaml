# The output alphabet: the only file in the package holding a phoneme string.
#
# One entry per letter, quality and qalqala degree -- not one row per feature
# tuple. `render/alphabet.py` composes the rest:
#
#   geminate    the token twice; a held ghunnah is already the sound of a
#               doubled letter, so it is not doubled again
#   emphatic    the entry's `emphatic` token. There is no suffix rule: a
#               letter with no `emphatic` cannot be one, and asking for it
#               raises rather than inventing a plausible `bˤ`
#   ghunnah     `hum` when not geminate and the entry has one, else `nasal`;
#               `heavy_hum` instead of either when also emphatic
#   long        ":" after the vowel
#
# An entry is a bare token, or a map with `plain` and whichever of `emphatic`,
# `nasal`, `hum`, `heavy_hum`, `eased` and `imala` the letter admits. Nine letters
# admit emphasis -- the seven of istilaa, plus the raa and the divine lam --
# which is exactly what `rules/tafkheem.py` can recolour.
#
# The three tables are total over `CanonLetter`, `Quality` and `Degree`,
# checked at load. Adding a letter to the model is one entry.
schema_version: 2
notation: ipa

consonants:
  alif: "ʔ"
  ba: "b"
  ta: "t"
  tha: "θ"
  jeem: "ʒ"
  ha: "ħ"
  # Istilaa, but no notation of its own: heavy by nature, and this alphabet
  # writes ˤ only where a letter has a light form to be told apart from.
  kha: {plain: "x", emphatic: "x"}
  dal: "d"
  thal: "ð"
  # The raa and the lam are the two whose light and heavy forms differ.
  ra: {plain: "r", emphatic: "rˤ"}
  zay: "z"
  seen: "s"
  sheen: "ʃ"
  # The four whose ˤ is inherent: the plain token already spells the emphasis,
  # so selecting the axis changes nothing.
  sad: {plain: "sˤ", emphatic: "sˤ"}
  dad: {plain: "dˤ", emphatic: "dˤ"}
  tah: {plain: "tˤ", emphatic: "tˤ"}
  zah: {plain: "ðˤ", emphatic: "ðˤ"}
  ain: "ʕ"
  ghain: {plain: "ɣ", emphatic: "ɣ"}
  fa: "f"
  qaf: {plain: "q", emphatic: "q"}
  kaf: "k"
  lam: {plain: "l", emphatic: "lˤ"}
  # The four a ghunnah can be held on, when a noon or a meem merges into them.
  # `nasal` is the held (geminate) hum on all four; `noon` alone also takes
  # `hum`, the un-held hum an ikhfaa or iqlab leaves with no letter to merge
  # into, and `heavy_hum`, the same hum before an istilaa letter.
  meem: {plain: "m", nasal: "m̃"}
  noon: {plain: "n", nasal: "ñ", hum: "ŋ", heavy_hum: "ŋˤ"}
  heh: "h"
  waw: {plain: "w", nasal: "w̃"}
  ya: {plain: "j", nasal: "j̃"}
  # `eased` is read but not yet composed: see `render/alphabet.py::Entry`.
  hamza: {plain: "ʔ", eased: "ʔ̞"}
  taa_marbuta: "t"

vowels:
  # Emphasis spreads onto an `a` and onto no other vowel.
  a: {plain: "a", emphatic: "aˤ"}
  u: "u"
  i: "i"
  # The inclined vowel. `plain` is the reading for a caller who has not asked
  # for the distinction, so one site does not enlarge the inventory.
  e: {plain: "i", imala: "e"}

releases:
  # All three read "Q" until a toggle asks for the degree; see
  # `render/alphabet.py::Entry.eased` for the same deferral on `hamza`.
  sughra: "Q"
  kubra: "Q"
  akbar: "Q"
