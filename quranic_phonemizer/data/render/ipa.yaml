# The output alphabet: the only file in the package holding a phoneme string.
#
# One entry per letter, quality, nasal place and release kind -- not one row
# per feature tuple. `render/alphabet.py` composes the rest:
#
#   geminate  the token twice; a nasalized consonant is already the sound of
#             a held letter, so it is not doubled again
#   emphatic  the entry's `emphatic` token. There is no suffix rule: a letter
#             with no `emphatic` cannot be one, and asking for it raises
#             rather than inventing a plausible `bˤ`
#   long      ":" after the vowel
#
# An entry is a bare token, or a map with `plain` and whichever of `emphatic`
# and `nasal` the letter admits. Nine letters admit emphasis -- the seven of
# istilaa, plus the raa and the divine lam -- which is exactly what
# `rules/tafkheem.py` can recolour.
#
# The four tables are total over `CanonLetter`, `Quality`, `NasalPlace` and
# `ReleaseKind`, checked at load. Adding a letter to the model is one entry.
schema_version: 2
notation: ipa

consonants:
  alif: "ʔ"
  ba: "b"
  ta: "t"
  tha: "θ"
  jeem: "ʒ"
  ha: "ħ"
  # Istilaa, but no notation of its own: heavy by nature, and this alphabet
  # writes ˤ only where a letter has a light form to be told apart from.
  kha: {plain: "x", emphatic: "x"}
  dal: "d"
  thal: "ð"
  # The raa and the lam are the two whose light and heavy forms differ.
  ra: {plain: "r", emphatic: "rˤ"}
  zay: "z"
  seen: "s"
  sheen: "ʃ"
  # The four whose ˤ is inherent: the plain token already spells the emphasis,
  # so selecting the axis changes nothing.
  sad: {plain: "sˤ", emphatic: "sˤ"}
  dad: {plain: "dˤ", emphatic: "dˤ"}
  tah: {plain: "tˤ", emphatic: "tˤ"}
  zah: {plain: "ðˤ", emphatic: "ðˤ"}
  ain: "ʕ"
  ghain: {plain: "ɣ", emphatic: "ɣ"}
  fa: "f"
  qaf: {plain: "q", emphatic: "q"}
  kaf: "k"
  lam: {plain: "l", emphatic: "lˤ"}
  # The four a ghunnah can be held on, when a noon or a meem merges into them.
  meem: {plain: "m", nasal: "m̃"}
  noon: {plain: "n", nasal: "ñ"}
  heh: "h"
  waw: {plain: "w", nasal: "w̃"}
  ya: {plain: "j", nasal: "j̃"}
  hamza: "ʔ"
  taa_marbuta: "t"

vowels:
  # Emphasis spreads onto an `a` and onto no other vowel.
  a: {plain: "a", emphatic: "aˤ"}
  u: "u"
  i: "i"
  e: "e"

nasals:
  # The ghunnah where no letter hosts it. No emphatic form: no rule recolours
  # a nasal.
  bilabial: "m̃"
  assimilated: "ŋ"

releases:
  qalqala: "Q"
